- title: Working Papers and Ongoing Projects
  type: time_table
  contents:
    - title: Rethinking Memory-Efficient Optimizers for LLM Pre-Training
      description:
        - Systematic study of structured optimizer-state compression vs. state quantization under matched memory budgets.
        - Peak-memory and communication analysis of optimizer states under sharding (FSDP-style).
        - In submission to ICLR 2027.
    - title: Hyperparameter Transfer and Scaling Laws for Asynchronous Pretraining
      description:
        - Theoretical and practical transfer rules (learning rate, momentum, batch size, weight decay) for asynchronous pipeline-parallel training.
        - Scaling laws in models and tokens; extends our ICML 2026 results.
        - Experiments in progress.
    - title: Optimization in RL Post-Training (RLVR)
      description:
        - Benchmarking optimizer behavior, loss-landscape changes, and downstream-task effects when moving from pretraining to RL post-training.
        - Early stage.
    - title: Asynchronous Post-Training
      description:
        - Mitigating policy staleness from parallel rollout generation.
        - Algorithm-systems co-design for maximizing GPU throughput in RL post-training.
        - Early stage.

